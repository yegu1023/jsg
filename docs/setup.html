<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEAM ENERGY 연결 설정</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="live.css"></head><body><header><a href="index.html">TEAM <b>ENERGY</b><span>연결 설정</span></a></header><main class="admin"><h2>Supabase 연결 파일 만들기</h2><p>Supabase에서 복사한 공개용 연결 정보 두 개를 입력하세요. 입력한 정보는 이 페이지에서 저장하지 않습니다.</p><form id="setup"><label>Project URL<input id="url" type="url" placeholder="https://프로젝트주소.supabase.co" required></label><label>Publishable key<input id="key" placeholder="sb_publishable_…" required></label><label>상담 링크 (선택)<input id="consult" type="url" placeholder="문의 폼 또는 홈페이지 주소"></label><div class="actions"><button type="button" id="check">연결 확인</button><button class="primary">config.js 다운로드</button></div></form><p id="status" role="status"></p><p class="note">다운로드한 config.js를 GitHub의 docs 폴더에 올려 기존 파일을 교체하세요. secret 키·service_role 키·운영자 비밀번호는 입력하지 마세요. 연결 확인은 SQL 설치까지 끝난 후 성공합니다.</p><p><a href="admin.html">운영자 화면</a> · <a href="dashboard.html">현황판</a> · <a href="index.html">참여 화면</a></p></main><script src="setup.js"></script></body></html>
